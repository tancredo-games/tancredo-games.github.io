<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Carregando Minecraft</title><body style="background:#101116;color:#c6fa57;font-family:sans-serif"><p id="status">Carregando Minecraft…</p><script>(async()=>{try{const parts=await Promise.all(["Eaglercraft_1.12_JS.part0.bin", "Eaglercraft_1.12_JS.part1.bin", "Eaglercraft_1.12_JS.part2.bin", "Eaglercraft_1.12_JS.part3.bin"].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error();return r.arrayBuffer()}));const text=await new Blob(parts).text();document.open();document.write(text);document.close()}catch(e){document.getElementById("status").textContent="Não foi possível carregar. Atualize a página para tentar novamente."}})()</script></body></html>
