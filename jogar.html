<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jogar · Tancredo</title><style>body{margin:0;background:#101116;color:#f5f5ef;font:14px sans-serif}a{color:#c6fa57}button{cursor:pointer;background:#c6fa57;color:#101116;border:0;padding:11px 16px;border-radius:7px}header{padding:15px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:16px;flex:1;margin:0}iframe{display:block;width:100%;height:calc(100dvh - 80px);border:0;background:black}#launch{max-width:500px;margin:80px auto;padding:24px;line-height:1.8}#notice{color:#9699a8;font-size:12px}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:4px}</style><header><a href="jogos.html">← Biblioteca</a><h1 id="name">Carregando…</h1><button id="fullscreen" hidden>Tela cheia</button><a id="direct" hidden target="_blank" rel="noopener">Abrir separado ↗</a></header><div id="launch"><p id="message">Preparando o jogo…</p><p id="notice"></p><label id="version-label" for="version" hidden>Escolha a versão</label><select id="version" hidden style="display:block;width:100%;margin:12px 0 24px;padding:14px;background:#191b23;color:#fff;border:1px solid #ffffff30;border-radius:8px"></select><button id="start" hidden>Iniciar jogo</button></div><div id="screen"></div><script>let frame;const byId=id=>document.getElementById(id);(async()=>{try{const r=await fetch('games.json');if(!r.ok)throw Error();const games=await r.json();const raw=new URLSearchParams(location.search).get('id');const game=raw!==null&&/^\d+$/.test(raw)?games[Number(raw)]:null;if(!game)throw Error();byId('name').textContent=game.name;document.title=game.name+' · Tancredo';byId('direct').href=game.url;byId('direct').hidden=false;const external=game.url.startsWith('https:');byId('message').textContent=external?'Este jogo está disponível no site do criador. Use “Abrir separado” para jogar.':'Tudo pronto para começar sua partida.';byId('notice').textContent=game.external?'Este jogo carrega recursos de serviços externos e pode demorar ou ficar indisponível.':'O carregamento pode levar alguns instantes.';if(!external){let selectedUrl=game.url;if(game.versions){const select=byId('version');select.hidden=false;byId('version-label').hidden=false;game.versions.forEach(v=>{const option=document.createElement('option');option.value=v.url;option.textContent=v.name;select.append(option)});select.onchange=()=>{selectedUrl=select.value;byId('direct').href=selectedUrl};byId('message').textContent='Todas as versões de Minecraft em um só lugar. Escolha a sua e inicie a partida.'}byId('start').hidden=false;byId('start').onclick=()=>{frame=document.createElement('iframe');frame.title=game.name;frame.setAttribute('allow','fullscreen; autoplay; gamepad; clipboard-write');frame.allowFullscreen=true;frame.src=selectedUrl;byId('screen').append(frame);byId('launch').hidden=true;byId('fullscreen').hidden=false};byId('fullscreen').onclick=async()=>{try{await frame.requestFullscreen()}catch{byId('fullscreen').textContent='Use Abrir separado'}}}}catch{byId('name').textContent='Jogo indisponível';byId('message').textContent='Não foi possível localizar o jogo. Volte à biblioteca e tente novamente.'}})();</script></html>
